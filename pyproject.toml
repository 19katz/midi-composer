[project]
name = "midicomposer"
version = "0.1.0"
description = "Fine-tune a small LLM to compose classical piano music from natural-language instructions"
requires-python = ">=3.9"
dependencies = [
    "pretty_midi>=0.2.10",
    "mido>=1.3",
    "numpy",
]

[project.optional-dependencies]
describe = ["music21", "google-genai"]
train = ["torch", "transformers", "peft", "trl", "datasets"]
dev = ["pytest", "jupyter"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
